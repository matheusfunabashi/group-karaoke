openapi: 3.1.0
info:
  title: recordings service
  description: Uploads one audio clip per claimed turn and builds the finale playlist.
    Calls the sessions service over HTTP.
  version: 1.0.0
paths:
  /health:
    get:
      summary: 'Health: service, version and database status (503 when the database
        is unreachable)'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /api/recordings:
    post:
      tags:
      - recordings
      summary: Upload Recording
      operationId: upload_recording_api_recordings_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_recording_api_recordings_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/recordings/sessions/{session_id}/finale:
    get:
      tags:
      - recordings
      summary: Get Finale
      operationId: get_finale_api_recordings_sessions__session_id__finale_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_upload_recording_api_recordings_post:
      properties:
        turn_id:
          type: integer
          title: Turn Id
        clip:
          type: string
          contentMediaType: application/octet-stream
          title: Clip
      type: object
      required:
      - turn_id
      - clip
      title: Body_upload_recording_api_recordings_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
